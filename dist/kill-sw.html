<!DOCTYPE html>
<html>
<head>
  <title>Killing Service Worker</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #0f0;
      padding: 20px;
    }
    .status { margin: 10px 0; }
    .done { color: #0ff; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔫 Nuclear Cache Cleanup</h1>
  <div id="status"></div>
  <script>
    (async function() {
      const log = (msg, isDone = false) => {
        const div = document.createElement('div');
        div.className = isDone ? 'status done' : 'status';
        div.textContent = msg;
        document.getElementById('status').appendChild(div);
      };

      log('🔄 Starting nuclear cleanup...');

      // 1. Unregister ALL service workers
      if ('serviceWorker' in navigator) {
        log('🔄 Unregistering all service workers...');
        const regs = await navigator.serviceWorker.getRegistrations();
        for (let reg of regs) {
          await reg.unregister();
          log(`  ✓ Unregistered: ${reg.scope}`);
        }
        log('✅ All service workers unregistered', true);
      }

      // 2. Clear ALL caches
      if ('caches' in window) {
        log('🔄 Clearing all caches...');
        const keys = await caches.keys();
        for (let key of keys) {
          await caches.delete(key);
          log(`  ✓ Deleted cache: ${key}`);
        }
        log('✅ All caches cleared', true);
      }

      // 3. Clear storage
      log('🔄 Clearing storage...');
      localStorage.clear();
      sessionStorage.clear();
      log('✅ Storage cleared', true);

      // 4. Clear IndexedDB
      if (window.indexedDB) {
        log('🔄 Clearing IndexedDB...');
        const dbs = await indexedDB.databases();
        for (let db of dbs) {
          if (db.name) {
            indexedDB.deleteDatabase(db.name);
            log(`  ✓ Deleted DB: ${db.name}`);
          }
        }
        log('✅ IndexedDB cleared', true);
      }

      log('');
      log('🎉 NUCLEAR CLEANUP COMPLETE!', true);
      log('Reloading in 2 seconds with cache bypass...');

      setTimeout(() => {
        // Hard reload with cache bypass
        window.location.href = '/?t=' + Date.now();
        setTimeout(() => {
          window.location.reload(true);
        }, 100);
      }, 2000);
    })();
  </script>
</body>
</html>
