<!DOCTYPE html>
<html>
<head>
  <title>Clear Cache</title>
</head>
<body>
  <h1>Clearing All Caches...</h1>
  <div id="status"></div>
  <script>
    (async function() {
      const status = document.getElementById('status');
      
      status.innerHTML += '<p>🔄 Unregistering service workers...</p>';
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (let reg of regs) {
          await reg.unregister();
        }
        status.innerHTML += '<p>✅ Service workers cleared</p>';
      }
      
      status.innerHTML += '<p>🔄 Clearing caches...</p>';
      if ('caches' in window) {
        const keys = await caches.keys();
        for (let key of keys) {
          await caches.delete(key);
        }
        status.innerHTML += '<p>✅ Caches cleared</p>';
      }
      
      status.innerHTML += '<p>🔄 Clearing storage...</p>';
      localStorage.clear();
      sessionStorage.clear();
      status.innerHTML += '<p>✅ Storage cleared</p>';
      
      status.innerHTML += '<p><strong>✅ ALL CACHES CLEARED!</strong></p>';
      status.innerHTML += '<p>Performing hard reload in 2 seconds...</p>';

      setTimeout(() => {
        // Hard reload with cache bypass
        window.location.href = '/?nocache=' + Date.now();
        setTimeout(() => {
          window.location.reload(true);
        }, 100);
      }, 2000);
    })();
  </script>
</body>
</html>
